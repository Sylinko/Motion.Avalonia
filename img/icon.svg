<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft shadows per depth tier (back -> mid -> front) -->
    <filter id="shadowBack" x="-30%" y="-30%" width="160%" height="165%">
      <feDropShadow dx="-4" dy="12" stdDeviation="14" flood-color="#6D28D9" flood-opacity="0.22" />
    </filter>
    <filter id="shadowMid" x="-30%" y="-30%" width="160%" height="165%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.18" />
    </filter>
    <filter id="shadowFront" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#4338CA" flood-opacity="0.20" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.08" />
    </filter>

    <!-- Optical frosted glass blur -->
    <filter id="frostMid" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
    <filter id="frostFront" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20" />
    </filter>

    <!-- Subtle glow for inner easing curve -->
    <filter id="markShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#4338CA" flood-opacity="0.18" />
    </filter>

    <!-- Layer 1 (Back-left origin slot): rich pastel violet-indigo -->
    <linearGradient id="layer1Grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="55%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <!-- Layer 2 (Mid interpolated glass frame): airy violet-sky tint -->
    <linearGradient id="layer2Fill" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.62" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.54" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.68" />
    </linearGradient>
    <linearGradient id="layer2Rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0.65" />
    </linearGradient>

    <!-- Layer 3 (Front hero frosted-glass destination card) -->
    <linearGradient id="layer3Fill" x1="6%" y1="4%" x2="94%" y2="96%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.88" />
      <stop offset="48%" stop-color="#F6F5FF" stop-opacity="0.68" />
      <stop offset="100%" stop-color="#E6F5FF" stop-opacity="0.62" />
    </linearGradient>
    <linearGradient id="layer3Spec" x1="0%" y1="0%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.74" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="layer3Rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98" />
      <stop offset="50%" stop-color="#E0E7FF" stop-opacity="0.84" />
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0.76" />
    </linearGradient>

    <!-- Sleek diagonal cubic-bezier curve emblem on front glass card -->
    <linearGradient id="curveGrad" gradientUnits="userSpaceOnUse" x1="216" y1="300" x2="386" y2="164">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="52%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <!-- G2 curvature-continuous SmoothBorder squircle paths -->
    <path id="layer1Squircle"
          d="M 163.20 176.00 L 232.80 176.00 C 257.91 176.00, 288.60 176.00, 306.30 193.70 C 324.00 211.40, 324.00 242.09, 324.00 267.20 L 324.00 336.80 C 324.00 361.91, 324.00 392.60, 306.30 410.30 C 288.60 428.00, 257.91 428.00, 232.80 428.00 L 163.20 428.00 C 138.09 428.00, 107.40 428.00, 89.70 410.30 C 72.00 392.60, 72.00 361.91, 72.00 336.80 L 72.00 267.20 C 72.00 242.09, 72.00 211.40, 89.70 193.70 C 107.40 176.00, 138.09 176.00, 163.20 176.00 Z" />

    <path id="layer2Squircle"
          d="M 216.32 128.00 L 291.68 128.00 C 319.30 128.00, 353.06 128.00, 372.53 147.47 C 392.00 166.94, 392.00 200.70, 392.00 228.32 L 392.00 303.68 C 392.00 331.30, 392.00 365.06, 372.53 384.53 C 353.06 404.00, 319.30 404.00, 291.68 404.00 L 216.32 404.00 C 188.70 404.00, 154.94 404.00, 135.47 384.53 C 116.00 365.06, 116.00 331.30, 116.00 303.68 L 116.00 228.32 C 116.00 200.70, 116.00 166.94, 135.47 147.47 C 154.94 128.00, 188.70 128.00, 216.32 128.00 Z" />

    <path id="layer3Squircle"
          d="M 265.44 84.00 L 342.56 84.00 C 372.69 84.00, 409.52 84.00, 430.76 105.24 C 452.00 126.48, 452.00 163.31, 452.00 193.44 L 452.00 270.56 C 452.00 300.69, 452.00 337.52, 430.76 358.76 C 409.52 380.00, 372.69 380.00, 342.56 380.00 L 265.44 380.00 C 235.31 380.00, 198.48 380.00, 177.24 358.76 C 156.00 337.52, 156.00 300.69, 156.00 270.56 L 156.00 193.44 C 156.00 163.31, 156.00 126.48, 177.24 105.24 C 198.48 84.00, 235.31 84.00, 265.44 84.00 Z" />

    <!-- Tighter, cohesive stacked clips -->
    <clipPath id="midClip">
      <use href="#layer2Squircle" />
    </clipPath>
    <clipPath id="frontClip">
      <use href="#layer3Squircle" />
    </clipPath>

    <!-- Reusable geometry for real optical backdrop blur -->
    <g id="geomLayer1">
      <use href="#layer1Squircle" fill="url(#layer1Grad)" />
    </g>

    <g id="geomLayer2Visual">
      <use href="#layer2Squircle" fill="url(#layer2Fill)" />
    </g>
  </defs>

  <!-- Layer 1 (Back-left): origin layout tile -->
  <g filter="url(#shadowBack)">
    <use href="#geomLayer1" />
  </g>

  <!-- Layer 2 (Middle): translucent interpolated frame closely trailing the hero card -->
  <g filter="url(#shadowMid)">
    <g clip-path="url(#midClip)">
      <rect x="116" y="128" width="276" height="276" fill="#EEF2FF" fill-opacity="0.45" />
      <g filter="url(#frostMid)">
        <use href="#geomLayer1" />
      </g>
      <rect x="116" y="128" width="276" height="276" fill="url(#layer2Fill)" />
      <path d="M 116 128 L 392 128 L 392 238 Q 254 208 116 292 Z" fill="#FFFFFF" opacity="0.26" />
    </g>
    <path d="M 215.67 129.25 L 292.33 129.25 C 319.43 129.25, 352.55 129.25, 371.65 148.35 C 390.75 167.45, 390.75 200.57, 390.75 227.67 L 390.75 304.33 C 390.75 331.43, 390.75 364.55, 371.65 383.65 C 352.55 402.75, 319.43 402.75, 292.33 402.75 L 215.67 402.75 C 188.57 402.75, 155.45 402.75, 136.35 383.65 C 117.25 364.55, 117.25 331.43, 117.25 304.33 L 117.25 227.67 C 117.25 200.57, 117.25 167.45, 136.35 148.35 C 155.45 129.25, 188.57 129.25, 215.67 129.25 Z"
          fill="none" stroke="url(#layer2Rim)" stroke-width="2.5" />
  </g>

  <!-- Layer 3 (Front-right): crisp frosted-glass hero tile with optical refraction of Layers 1 & 2 -->
  <g filter="url(#shadowFront)">
    <g clip-path="url(#frontClip)">
      <rect x="156" y="84" width="296" height="296" fill="#F8FAFF" fill-opacity="0.72" />
      <g filter="url(#frostFront)">
        <use href="#geomLayer1" />
        <use href="#geomLayer2Visual" />
      </g>
      <rect x="156" y="84" width="296" height="296" fill="url(#layer3Fill)" />
      <!-- Crisp top-left diagonal glass sheen -->
      <path d="M 156 84 L 452 84 L 452 210 Q 304 172 156 266 Z" fill="url(#layer3Spec)" />
    </g>
    <path d="M 264.66 85.50 L 343.34 85.50 C 372.84 85.50, 408.90 85.50, 429.70 106.30 C 450.50 127.09, 450.50 163.16, 450.50 192.66 L 450.50 271.34 C 450.50 300.84, 450.50 336.90, 429.70 357.70 C 408.90 378.50, 372.84 378.50, 343.34 378.50 L 264.66 378.50 C 235.16 378.50, 199.09 378.50, 178.30 357.70 C 157.50 336.90, 157.50 300.84, 157.50 271.34 L 157.50 192.66 C 157.50 163.16, 157.50 127.09, 178.30 106.30 C 199.09 85.50, 235.16 85.50, 264.66 85.50 Z"
          fill="none" stroke="url(#layer3Rim)" stroke-width="3" />
  </g>

  <!-- Minimalist easing curve swoosh centered inside the front frosted-glass card -->
  <g filter="url(#markShadow)">
    <path d="M 224 294 C 282 294, 294 168, 384 168"
          fill="none" stroke="url(#curveGrad)" stroke-width="25" stroke-linecap="round" />
    <!-- Glowing destination endpoint dot -->
    <circle cx="384" cy="168" r="15.5" fill="#FFFFFF" />
    <circle cx="384" cy="168" r="8.5" fill="#0EA5E9" />
  </g>
</svg>
