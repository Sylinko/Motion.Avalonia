name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore tests/Motion.Avalonia.Tests/Motion.Avalonia.Tests.csproj --configfile NuGet.config

      - name: Build library and tests
        run: |
          dotnet build src/Motion.Avalonia/Motion.Avalonia.csproj --configuration Release
          dotnet build tests/Motion.Avalonia.Tests/Motion.Avalonia.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/Motion.Avalonia.Tests/Motion.Avalonia.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Pack library
        run: dotnet pack src/Motion.Avalonia/Motion.Avalonia.csproj --configuration Release --no-build -o ${{ github.workspace }}/out
